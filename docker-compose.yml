services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend

    container_name: freelancer-ai-backend

    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 3000

    depends_on:
      mongodb:
        condition: service_healthy

    networks:
      - freelancer-network

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend

    container_name: freelancer-ai-nginx

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend

    networks:
      - freelancer-network

networks:
  freelancer-network:
    driver: bridge

volumes:
  mongodb_data: